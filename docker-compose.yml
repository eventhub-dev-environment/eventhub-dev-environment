version: '3.8'

services:
  # Base de datos relacional (auth-service, booking-service, payment-service)
  postgres:
    image: postgres:16-alpine
    container_name: eventhub-postgres
    environment:
      POSTGRES_USER: ${MONGO_ROOT_USER}
      POSTGRES_PASSWORD: ${MONGO_ROOT_PASS}
      POSTGRES_DB: eventhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MONGO_ROOT_USER} -d eventhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  # Base de datos NoSQL (config-service, catalog-service, analytics-service)
  mongodb:
    image: mongo:7.0
    container_name: eventhub-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  # Event Broker (Kafka en modo Kraft)
  kafka:
    image: apache/kafka:3.7.0
    container_name: eventhub-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - eventhub-network

  # UI para gestionar Kafka desde el navegador
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eventhub-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - eventhub-network

  # Object Storage local (Branding y Tickets - S3 Compatible)
  minio:
    image: minio/minio:latest
    container_name: eventhub-minio
    environment:
      MINIO_ROOT_USER: ${MONGO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-network

  # Servidor de Trazabilidad Distribuida
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: eventhub-zipkin
    ports:
      - "9411:9411"
    networks:
      - eventhub-network

  # Microservicio Config Service
  config-service:
    build: ../eventhub-config-service
    container_name: eventhub-config-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongodb:27017/eventhub_config_db?authSource=admin
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - eventhub-network

  # Microservicio Auth Service
  auth-service:
    build: ../eventhub-auth-service
    container_name: eventhub-auth-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongodb:27017/eventhub_auth_db?authSource=admin
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - eventhub-network

  # API Gateway (Puerto Único Público)
  api-gateway:
    build: ../eventhub-api-gateway
    container_name: eventhub-api-gateway
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=${ZIPKIN_ENDPOINT}
      - GATEWAY_INTERNAL_SECRET=${GATEWAY_INTERNAL_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - config-service
      - auth-service
      - zipkin
    networks:
      - eventhub-network

networks:
  eventhub-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  minio_data: